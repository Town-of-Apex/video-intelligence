# Optional: self-hosted Whisper transcriber (web UI) for one-off TXT/JSON/SRT.
# Staff Training Assistant lives in Open WebUI on TOA:
#   http://10.9.81.141:3000  (Jetson Thor; select model "Training Assistant")
#
# Start:  docker compose up --build -d
# Stop:   docker compose down
# Reset:  docker compose down -v   (deletes data volumes)
#
# Knowledge ingest for the Training Assistant uses
# transcriptions/owui_format/*_chunks_for_owui.json from the CLI (main.py),
# not a custom Postgres RAG database. This compose stack does not host OWUI.

services:
  transcriber:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: video-intelligence-transcriber
    restart: unless-stopped
    environment:
      APP_DATA_DIR: /app/data
      WHISPER_MODEL: ${WHISPER_MODEL:-tiny.en}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-4294967296}
    ports:
      - "${TRANSCRIBER_PORT:-8081}:8000"
    volumes:
      # Jobs, exports, and Whisper model cache (HF_HOME) all live here.
      - transcriber_data:/app/data

volumes:
  transcriber_data:
