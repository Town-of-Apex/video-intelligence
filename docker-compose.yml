# PostgreSQL + pgvector for local transcript chunk storage and retrieval.
#
# Start:  docker compose up -d
# Stop:   docker compose down
# Reset:  docker compose down -v   (deletes data volumes)
#
# OpenWebUI (Docker) reaches this DB at host.docker.internal:5431 on Windows/macOS.
# Ollama (native app) stays on localhost:11434 for embeddings and chat.

services:
  transcriber:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: video-intelligence-transcriber
    restart: unless-stopped
    environment:
      APP_DATA_DIR: /app/data
      WHISPER_MODEL: ${WHISPER_MODEL:-tiny.en}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-4294967296}
    ports:
      - "${TRANSCRIBER_PORT:-8081}:8000"
    volumes:
      # Jobs, exports, and Whisper model cache (HF_HOME) all live here.
      - transcriber_data:/app/data

  postgres:
    image: pgvector/pgvector:pg17
    container_name: training-intelligence-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: training_intelligence
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5431:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d training_intelligence"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  transcriber_data:
